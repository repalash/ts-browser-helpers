name: Publish to npm

# On each push to master: when the version in package.json is not on npm yet, build and pack it,
# post a Discord notice (secret DISCORD_WEBHOOK_URL) with the approval link, and publish after the
# npm-publish environment is approved (npm trusted publishing, provenance). The commit is then
# tagged publish@<version>. Release = bump the version in package.json and merge.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels a run that still waits for approval.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Is this version on npm?
        id: version
        working-directory: .
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, build and pack
        id: build
        if: steps.version.outputs.publish == 'true'
        run: |
          npm ci
          npm test
          ./node_modules/.bin/clean-package
          mv "$(npm pack --silent)" package.tgz
          ./node_modules/.bin/clean-package restore
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: package
          path: package.tgz
          retention-days: 1
      - name: Commits since the last release
        if: always() && steps.version.outputs.publish == 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'publish@*' --match 'v[0-9]*' 2> /dev/null || true)
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          { echo 'COMMITS<<EOF'; git log --oneline --no-merges ${PREV:+$PREV..}HEAD -20 -- .; echo EOF; } >> "$GITHUB_ENV"
      # Starts a read-only review session of Palash's Claude Code routine (secrets CLAUDE_REVIEW_FIRE_URL,
      # CLAUDE_REVIEW_TOKEN; skipped when unset). Only for his pushes to master: forks never get the secrets.
      - name: Ask Claude to review the release
        id: claude
        if: steps.build.outcome == 'success' && github.event_name == 'push' && github.actor == 'repalash'
        continue-on-error: true
        env:
          FIRE_URL: ${{ secrets.CLAUDE_REVIEW_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.CLAUDE_REVIEW_TOKEN }}
          PKG: ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then echo "No Claude review routine set up; skipped."; exit 0; fi
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT=$(printf 'npm release review\nrepository: %s\npackage: %s (directory .)\ncommit: %s\nprevious release tag: %s\nrun (approval pending): %s\ncommits since the previous release:\n%s\n' \
            "$GITHUB_REPOSITORY" "$PKG" "$GITHUB_SHA" "${PREV:-none}" "$RUN" "$COMMITS")
          RES=$(jq -n --arg text "$TEXT" '{text: $text}' | curl -sS -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" -H "Content-Type: application/json" --data-binary @-)
          URL=$(echo "$RES" | jq -r '.claude_code_session_url // empty')
          if [ -n "$URL" ]; then echo "session=$URL" >> "$GITHUB_OUTPUT"; else echo "Routine fire failed: $(echo "$RES" | jq -c '.error // .' | head -c 300)"; fi
      - name: Notify Discord
        if: always() && steps.version.outputs.publish == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PKG: ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
          CLAUDE_SESSION: ${{ steps.claude.outputs.session }}
        run: node .github/scripts/notify-discord.mjs

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: package
      - run: npm publish package.tgz --provenance --access public
      - name: Tag the published commit
        run: |
          git tag "publish@${{ needs.check.outputs.version }}"
          git push origin "publish@${{ needs.check.outputs.version }}"
