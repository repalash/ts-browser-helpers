# .github/workflows/publish.yml of a single-package repository at the root.
# Builds with `npm ci` (the prepare script builds) and tests; packs with clean-package.
# Tags: publish@<version>.
name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Runs queue: a newer push waits; a running publish is never cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # tags
      id-token: write # npm trusted publishing
    uses: repalash/release-tools/.github/workflows/npm-release.yml@v1
    with:
      build: npm ci && npm test
      clean-package: true
    secrets: inherit
